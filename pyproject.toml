[project]
name = "unkillable-library"
version = "0.1.0"
description = "The Unkillable Library - local-only motion NVR with semantic search and paper QR backup"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10.0",
  "ultralytics>=8.0",
  "qrcode>=7.4",
  "reportlab>=4.0",
  "pyyaml>=6.0",
  "typer>=0.9",
  "rich>=13.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "flask>=3.0",
]

[project.optional-dependencies]
qr = ["pyzbar>=0.1.9"]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
unkillable = "unkillable.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unkillable"]

[tool.ruff]
line-length = 100
